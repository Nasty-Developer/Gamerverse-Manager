kind = "web"
previewPath = "/"
title = "GamerVerse"
version = "1.0.0"
id = "artifacts/gamerverse"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23489

[services.development]
run = "pnpm --filter @workspace/gamerverse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gamerverse", "run", "build" ]
publicDir = "artifacts/gamerverse/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23489"
BASE_PATH = "/"
